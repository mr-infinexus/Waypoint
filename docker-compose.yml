services:
  postgres:
    image: postgres:18
    container_name: waypoint-postgres
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: password
      POSTGRES_DB: waypoint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: waypoint-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: waypoint-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
